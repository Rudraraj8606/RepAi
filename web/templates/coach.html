<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepIQ - Coaching for {{ exercise }}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    a.back { color: #1d6fa5; text-decoration: none; }
    .card { border: 1px solid #eee; border-radius: 10px; padding: 1rem 1.2rem; margin: 1rem 0; }
    .card h2 { margin-top: 0; }
    .note { background: #fff8e1; border-color: #f0e0a0; }
    .diag { background: #eef4fb; }
    .plan { background: #eefaf0; }
  </style>
</head>
<body>
  <p><a class="back" href="/">&larr; Back to history</a></p>
  <h1>Coaching: {{ exercise }}</h1>

  {% if error %}
    <div class="card note"><p>{{ error }}</p></div>
  {% else %}
    <div class="card diag">
      <h2>Diagnosis (Agent 1)</h2>
      <p>{{ diagnosis }}</p>
    </div>
    <div class="card plan">
      <h2>Recommendation (Agent 2)</h2>
      <p>{{ plan }}</p>
    </div>
  {% endif %}
</body>
</html>
